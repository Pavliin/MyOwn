# TEMPORARY PATTERN — see docs/roadmap.md Phase 6 ("Sortir les secrets du
# dépôt public"). This directory commits per-user credentials (each family
# member's Nextcloud app-password and Mailu IMAP password, plus their
# account identifiers) into a public repo, encrypted with SOPS/age. That's
# only acceptable while a single person operates this repo: before it's
# opened to other users, these must move out of git entirely (per-user
# enrollment that stores credentials in the cluster/Vaultwarden, never
# committed) and be rotated, since the encrypted history stays readable to
# anyone who ever obtains the one age key protecting it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generators:
  - ./secret-generator.yaml
