apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.1.5
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 3d
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
        grafana:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - myown-grafana.local
            path: /
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # Grafana's admin password is auto-generated by the chart when unset —
    # each re-render produces a new random value, so without this the
    # Secret (and the Deployment's checksum/secret annotation it drives)
    # would fight ArgoCD's self-heal forever. No secret is committed here.
    - group: ""
      kind: Secret
      name: monitoring-grafana
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: monitoring-grafana
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
