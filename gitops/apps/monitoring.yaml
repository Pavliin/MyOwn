apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.1.5
      helm:
        valuesObject:
          alertmanager:
            enabled: false
          prometheus:
            prometheusSpec:
              retention: 3d
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
          grafana:
            admin:
              existingSecret: monitoring-secrets
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - myown-grafana.local
              path: /
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.12
      path: gitops/secrets/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
