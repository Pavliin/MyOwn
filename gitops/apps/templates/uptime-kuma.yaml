{{- if has "uptime-kuma" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://dirsigler.github.io/uptime-kuma-helm
      chart: uptime-kuma
      targetRevision: 4.1.0
      helm:
        valuesObject:
          # Pas d'Ingress du chart : page d'état publique et admin LAN/VPN (gitops/manifests/uptime-kuma-public, admin-access).
          ingress:
            enabled: false
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/uptime-kuma-public
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
    {{- include "myown.adminAccessSource" (dict "root" . "prefix" "uptime" "service" "uptime-kuma" "port" 3001) | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
