{{- if has "authentik" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.5.6
      helm:
        valuesObject:
          global:
            image:
              # Image surchargée : le dépôt Helm s'arrête au chart 2026.5.6 pour
              # la branche 2026.5, alors que 2026.5.7 corrige 5 CVE hautes
              # (GHSA-cxwx-9x59-28qm, -m9h4-7j9c-55x9, -cqj8-fxxf-9pg7,
              # -h6c5-mpvq-j4jc, -qgqp-xh8r-v73r) et 2026.5.8 est la dernière
              # de la branche (correctifs seuls, pas de migration annoncée).
              # À retirer dès que targetRevision passe à un chart ≥ 2026.5.8
              # (ou 2026.8.x), sinon l'image resterait figée ici.
              # renovate: datasource=docker depName=ghcr.io/goauthentik/server
              tag: 2026.5.8
          authentik:
            existingSecret:
              secretName: authentik-secrets
          postgresql:
            enabled: true
            auth:
              existingSecret: authentik-secrets
          server:
            # Pas d'Ingress du chart : nom unique <service>.<domaine>, servi par l'Ingress public (gitops/manifests/authentik-public).
            ingress:
              enabled: false
          # Blueprints en clair (gitops/manifests/authentik-blueprints), un
          # par service installé. Leurs secrets OIDC (`!Env <SERVICE>_CLIENT_SECRET`)
          # viennent du Secret authentik-sso-clients, créé par l'installeur à
          # partir du secret côté service (scripts/lib/cluster-secrets.py) — jamais commité.
          blueprints:
            configMaps:
              - authentik-blueprint-account-recovery
              - authentik-blueprint-login-mfa-optional
              - authentik-blueprint-admins
              {{- range list "vaultwarden" "nextcloud" "immich" "tuwunel" "jellyfin" "mailu" }}
              {{- if has . $.Values.apps }}
              - authentik-blueprint-{{ . }}-sso
              {{- end }}
              {{- end }}
          worker:
            envFrom:
              - secretRef:
                  name: authentik-sso-clients
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/authentik-blueprints
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
          apps: {{ toJson .Values.apps }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/authentik-backup
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/authentik-public
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
