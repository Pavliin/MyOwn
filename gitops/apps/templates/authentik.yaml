{{- if has "authentik" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.5.6
      helm:
        valuesObject:
          authentik:
            existingSecret:
              secretName: authentik-secrets
          postgresql:
            enabled: true
            auth:
              existingSecret: authentik-secrets
          server:
            # Pas d'Ingress du chart : nom unique <service>.<domaine>, servi par l'Ingress public (gitops/manifests/authentik-public).
            ingress:
              enabled: false
          blueprints:
            secrets:
              - authentik-blueprint-vaultwarden-sso
              - authentik-blueprint-nextcloud-sso
              - authentik-blueprint-immich-sso
              - authentik-blueprint-tuwunel-sso
              - authentik-blueprint-jellyfin-sso
              - authentik-blueprint-account-recovery
              - authentik-blueprint-mailu-sso
              - authentik-blueprint-login-mfa-optional
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/secrets/authentik
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/secrets/authentik-blueprints
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/authentik-backup
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/authentik-public
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
