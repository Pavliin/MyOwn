{{- if has "authentik" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.5.6
      helm:
        valuesObject:
          authentik:
            existingSecret:
              secretName: authentik-secrets
          postgresql:
            enabled: true
            auth:
              existingSecret: authentik-secrets
          server:
            # Pas d'Ingress du chart : nom unique <service>.<domaine>, servi par l'Ingress public (gitops/manifests/authentik-public).
            ingress:
              enabled: false
          # Blueprints en clair (gitops/manifests/authentik-blueprints), un
          # par service installé. Leurs secrets OIDC (`!Env <SERVICE>_CLIENT_SECRET`)
          # viennent du Secret authentik-sso-clients, créé par l'installeur à
          # partir du secret côté service (scripts/lib/secrets.sh) — jamais commité.
          blueprints:
            configMaps:
              - authentik-blueprint-account-recovery
              - authentik-blueprint-login-mfa-optional
              {{- range list "vaultwarden" "nextcloud" "immich" "tuwunel" "jellyfin" "mailu" }}
              {{- if has . $.Values.apps }}
              - authentik-blueprint-{{ . }}-sso
              {{- end }}
              {{- end }}
          worker:
            envFrom:
              - secretRef:
                  name: authentik-sso-clients
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/secrets/authentik
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/authentik-blueprints
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
          apps: {{ toJson .Values.apps }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/authentik-backup
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/authentik-public
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
