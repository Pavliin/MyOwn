{{- if has "secrets-backup" .Values.apps }}
# Sauvegarde chiffrée des Secrets générés dans le cluster (gitops/manifests/secrets-backup).
# Infrastructure, jamais proposée dans la liste des services : l'installeur
# l'ajoute toujours (scripts/lib/services.sh).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: gitops/manifests/secrets-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: myown-backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
