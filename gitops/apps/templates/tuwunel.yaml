{{- if has "tuwunel" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuwunel
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/tuwunel
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/tuwunel-backup
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/tuwunel-public
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/tuwunel-federation-delegation
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
  destination:
    server: https://kubernetes.default.svc
    namespace: tuwunel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
