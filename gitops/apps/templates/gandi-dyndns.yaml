{{- if has "gandi-dyndns" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gandi-dyndns
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/gandi-dyndns
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/secrets/gandi-dyndns
  destination:
    server: https://kubernetes.default.svc
    namespace: gandi-dyndns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
