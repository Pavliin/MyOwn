{{- if has "dyndns" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dyndns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: gitops/manifests/dyndns
  destination:
    server: https://kubernetes.default.svc
    namespace: dyndns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
