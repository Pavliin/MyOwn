{{- if has "monitoring" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.1.5
      helm:
        valuesObject:
          alertmanager:
            enabled: false
          prometheus:
            prometheusSpec:
              retention: 3d
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
          grafana:
            admin:
              existingSecret: monitoring-secrets
            # Pas d'Ingress du chart : <outil>.<domaine>, réservé au LAN/VPN (gitops/manifests/admin-access).
            ingress:
              enabled: false
    {{- include "myown.adminAccessSource" (dict "root" . "prefix" "grafana" "service" "monitoring-grafana" "port" 80) | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
