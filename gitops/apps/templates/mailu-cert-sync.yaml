{{- if has "mailu-cert-sync" .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailu-cert-sync
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: gitops/manifests/mailu-cert-sync
      helm:
        valuesObject:
          domain: {{ include "myown.domain" . }}
  destination:
    server: https://kubernetes.default.svc
    # Nominal only — every resource in this Application sets its own
    # explicit namespace (kube-system or mailu), see kustomization.yaml.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
