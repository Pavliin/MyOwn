apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://guerzon.github.io/vaultwarden
      chart: vaultwarden
      targetRevision: 0.46.0
      helm:
        valuesObject:
          adminToken:
            existingSecret: vaultwarden-secrets
            existingSecretKey: ADMIN_TOKEN
          storage:
            data:
              name: data
              size: 1Gi
              accessMode: ReadWriteOnce
          ingress:
            enabled: true
            class: traefik
            tls: true
            tlsSecret: vaultwarden-tls
            nginxIngressAnnotations: false
            hostname: myown-vaultwarden.local
          sso:
            enabled: true
            authority: "http://myown-authentik.local:8090/application/o/vaultwarden"
            scopes: "openid email profile"
            existingSecret: vaultwarden-secrets
            clientId:
              existingSecretKey: SSO_CLIENT_ID
            clientSecret:
              existingSecretKey: SSO_CLIENT_SECRET
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: master
      path: gitops/secrets/vaultwarden
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  ignoreDifferences:
    # Kubernetes normalizes each volumeClaimTemplate once the PVC is
    # provisioned: adds apiVersion/kind, defaults spec.volumeMode, and
    # populates status — none of which the desired manifest has. Without
    # ignoring all four, the StatefulSet stays OutOfSync forever
    # (well-known ArgoCD/StatefulSet limitation, not specific to this
    # chart — verified by diffing the live object against `argocd app
    # manifests` directly, `argocd app diff` alone didn't surface it).
    - group: apps
      kind: StatefulSet
      name: vaultwarden
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].status
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
        - .spec.volumeClaimTemplates[].spec.volumeMode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
