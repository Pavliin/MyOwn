apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://guerzon.github.io/vaultwarden
      chart: vaultwarden
      targetRevision: 0.46.0
      helm:
        valuesObject:
          # Real public hostname now (was myown-vaultwarden.local:8453) —
          # this is what Vaultwarden itself uses to build its own
          # callback/redirect URLs. Reachable from LAN too, post
          # split-horizon DNS (gitops/bootstrap/coredns-custom.yaml).
          domain: "https://vaultwarden.offsystem.fr"
          adminToken:
            existingSecret: vaultwarden-secrets
            existingSecretKey: ADMIN_TOKEN
          storage:
            data:
              name: data
              size: 1Gi
              accessMode: ReadWriteOnce
          ingress:
            enabled: true
            class: traefik
            tls: true
            tlsSecret: vaultwarden-tls
            nginxIngressAnnotations: false
            hostname: myown-vaultwarden.local
          sso:
            enabled: true
            # authentik.offsystem.fr, not myown-authentik.local: Authentik
            # builds its OIDC discovery document (including the
            # authorization_endpoint used for the browser redirect) from
            # the Host of whichever request fetches it — so this exact
            # hostname is what ends up in the login redirect too. Using
            # the LAN-only name here would mean external logins always
            # redirect to somewhere unreachable, even though Vaultwarden
            # itself is reachable at vaultwarden.offsystem.fr. Resolves
            # internally either way post split-horizon DNS, so no
            # performance cost for LAN-only traffic.
            #
            # https://, not http:// — real bug found live: the new
            # authentik-public Ingress (gitops/manifests/authentik-public/)
            # carries a `tls` block, so Traefik only serves it on the
            # websecure entrypoint (8453/443); port 8090 returns a bare
            # 404 for this host (confirmed via curl, unlike
            # myown-authentik.local which still answers on both). Real
            # Let's Encrypt cert means no CA-trust workaround needed
            # here, unlike the mkcert-CA mounting lk-jwt-service/Uptime
            # Kuma needed for the same class of internal HTTPS call.
            authority: "https://authentik.offsystem.fr/application/o/vaultwarden/"
            scopes: "openid email profile"
            ignoreEmailVerification: true
            existingSecret: vaultwarden-secrets
            clientId:
              existingSecretKey: SSO_CLIENT_ID
            clientSecret:
              existingSecretKey: SSO_CLIENT_SECRET
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.5
      path: gitops/secrets/vaultwarden
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.5
      path: gitops/manifests/vaultwarden-backup
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.5
      path: gitops/manifests/vaultwarden-public
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  ignoreDifferences:
    # Kubernetes normalizes each volumeClaimTemplate once the PVC is
    # provisioned: adds apiVersion/kind, defaults spec.volumeMode, and
    # populates status — none of which the desired manifest has. Without
    # ignoring all four, the StatefulSet stays OutOfSync forever
    # (well-known ArgoCD/StatefulSet limitation, not specific to this
    # chart — verified by diffing the live object against `argocd app
    # manifests` directly, `argocd app diff` alone didn't surface it).
    - group: apps
      kind: StatefulSet
      name: vaultwarden
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].status
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
        - .spec.volumeClaimTemplates[].spec.volumeMode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
