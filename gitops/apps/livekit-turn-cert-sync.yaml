apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: livekit-turn-cert-sync
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.9
      path: gitops/manifests/livekit-turn-cert-sync
  destination:
    server: https://kubernetes.default.svc
    # Nominal only — every resource in this Application sets its own
    # explicit namespace (kube-system or livekit), see kustomization.yaml.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
