apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: livekit
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.livekit.io
      chart: livekit-server
      targetRevision: 1.9.0
      helm:
        valuesObject:
          # Chart default app version (1.9.0, protocol 16) predates the
          # `/rtc/v1` WebSocket signaling path that the livekit-client JS
          # SDK bundled by Element Call (app.element.io, 2.20.0, protocol
          # 17) tries first on every (re)connect. Real bug found via an
          # actual Element Call session, not curl: browser console showed
          # a 404 on `/rtc/v1/validate` ("v1 RTC path not found. Consider
          # upgrading your LiveKit server version"), falling back to the
          # legacy `/rtc` path — which worked, but a later
          # `NegotiationError: negotiation timed out` forced a full
          # reconnect, which retried `/rtc/v1` again, looping every ~15s.
          # Pinning to the current stable server image (independent of the
          # chart version, which lags behind actual livekit-server
          # releases) fixes the mismatch.
          image:
            tag: v1.13.5
          # Not just "livekit" — Kubernetes auto-injects Docker-links env
          # vars per Service (<SVC>_PORT etc.), and a Service named exactly
          # "livekit" collides with LiveKit's own LIVEKIT_PORT env binding
          # (confirmed live: CrashLoopBackOff, "could not parse
          # tcp://...:80 as uint value... for flag port"). Same class of
          # bug as Tuwunel's enableServiceLinks gotcha, but this chart has
          # no such toggle — renaming the Service is the fix here instead.
          fullnameOverride: livekit-sfu
          livekit:
            port: 7880
            # Relative, no leading slash — Kubernetes rejects an absolute
            # subPath, and this chart reuses key_file for both the
            # mountPath and the subPath into the keys Secret. Verified
            # locally: LiveKit itself resolves it fine (relative to its
            # own root), file lands at /keys.yaml in the container.
            key_file: keys.yaml
            rtc:
              tcp_port: 7881
              # Single-port mode, not the usual 50000-60000 range — one
              # instance on one node (this cluster), and a wide UDP range
              # would mean mapping thousands of k3d ports instead of one.
              udp_port: 7882
              port_range_start: null
              port_range_end: null
              # podHostNetwork (chart default, left as-is) puts the pod on
              # the real host network namespace, so STUN-based external-IP
              # detection correctly finds the host's actual LAN/public IP
              # instead of an internal Docker address — confirmed via a
              # local test render + live pod before writing this.
              use_external_ip: true
              # Real bug found live (2026-08-22), external call test: the
              # Freebox doesn't support UDP hairpin NAT (TCP/443 hairpin
              # already validated earlier, UDP is a separate router
              # capability). LiveKit's default self-ping validation of its
              # own STUN-discovered public IP times out ("context
              # canceled") because that self-ping is itself a UDP hairpin
              # round-trip — and on failure LiveKit silently falls back to
              # advertising every local interface IP raw (cluster CIDR,
              # WireGuard, LAN IP), never the real public IP. Documented
              # upstream specifically for this NAT class:
              # "enable this when SFU is behind NAT that does not allow
              # self-ping". Confirmed fixed live: STUN-discovered
              # 82.67.34.121 correctly appears in the advertised candidate
              # list once this is set.
              skip_external_ip_validation: true
            # No TURN server was configured at all before this (2026-08-22)
            # — LiveKit only offered direct/STUN candidates. Real bug found
            # via an actual external call: worked from a client on the same
            # LAN (fell back to an ICE/TCP candidate via the already-open
            # 7881), failed for every mobile client (WebRTC stacks there
            # depend on UDP, and without a relay there was no usable path
            # once direct UDP failed). The chart mounts `secretName`
            # automatically (LIVEKIT_TURN_CERT/LIVEKIT_TURN_KEY env vars +
            # volume, see templates/deployment.yaml) — reuses the same real
            # Let's Encrypt wildcard cert Traefik already manages, extracted
            # from its acme.json (see livekit-turn-cert-sync CronJob) rather
            # than issuing a separate cert. TCP/TLS only for now (most
            # NAT/firewall-resilient) — a UDP TURN listener is easy to add
            # later (`udp_port:`) if TCP alone ever proves insufficient.
            turn:
              enabled: true
              domain: livekit.offsystem.fr
              tls_port: 5349
              secretName: livekit-turn-tls
          # Real bug found deploying this for real via ArgoCD (never
          # surfaced by the earlier hand-patched live test): the chart
          # defaults turnLoadbalancer.enable to true, silently creating a
          # second LoadBalancer Service on port 443 — colliding with
          # Traefik's own LoadBalancer Service already on that port via
          # k3s's ServiceLB. Not needed at all here: the pod's own
          # hostNetwork binding + the Freebox port-forward already expose
          # 5349 directly, no Service/LoadBalancer layer required (same
          # pattern as the existing 7881/7882 RTC ports).
          turnLoadbalancer:
            enable: false
          storeKeysInSecret:
            enabled: true
            existingSecret: livekit-secrets
          loadBalancer:
            # No cloud LB here — the chart skips creating an Ingress
            # entirely when disabled, so the WS port is exposed via our
            # own raw Ingress (gitops/manifests/livekit-ingress/) instead.
            type: disable
          # Real deadlock found live (2026-08-22) rolling out the TURN
          # change above: default RollingUpdate tries to surge a second
          # pod before killing the first, but both are hostNetwork on the
          # same single node — the surge pod can never schedule (port
          # conflict on 7880/7881/7882/5349), so the rollout hangs
          # forever ("1 old replicas are pending termination"). Recreate
          # (stop then start) is the correct strategy for any hostNetwork
          # Deployment on a single-node cluster; will bite the same way on
          # every future livekit-sfu change without this.
          deploymentStrategy:
            type: Recreate
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.10
      path: gitops/secrets/livekit
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.10
      path: gitops/manifests/livekit-ingress
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.10
      path: gitops/manifests/lk-jwt-service
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.10
      path: gitops/manifests/livekit-public
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.10
      path: gitops/manifests/lk-jwt-service-public
  destination:
    server: https://kubernetes.default.svc
    namespace: livekit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
