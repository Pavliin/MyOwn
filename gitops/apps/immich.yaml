apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://immich-app.github.io/immich-charts
      chart: immich
      targetRevision: 0.12.0
      helm:
        valuesObject:
          # Shared across every Immich component (server, machine-learning,
          # ...) per the chart's own convention — same block that already
          # carries REDIS_HOSTNAME/IMMICH_MACHINE_LEARNING_URL by default.
          controllers:
            main:
              containers:
                main:
                  env:
                    DB_HOSTNAME: immich-postgres
                    DB_USERNAME: immich
                    DB_DATABASE_NAME: immich
                    DB_PASSWORD:
                      valueFrom:
                        secretKeyRef:
                          name: immich-secrets
                          key: DB_PASSWORD
          immich:
            persistence:
              library:
                existingClaim: immich-library
            # Partial config file — merged with schema defaults (verified
            # in the server source before relying on it, docs don't say so
            # explicitly), so this only sets OAuth and leaves everything
            # else (ML, quotas, storage template) untouched.
            existingConfiguration: immich-oauth-config
            configurationKind: Secret
          valkey:
            enabled: true
          server:
            ingress:
              main:
                enabled: true
                className: traefik
                # The chart's default nginx.ingress.kubernetes.io/proxy-body-size
                # annotation stays (Helm map-merge doesn't let `annotations: {}`
                # clear a populated default) — harmless no-op on Traefik.
                hosts:
                  - host: myown-immich.local
                    paths:
                      - path: "/"
                        service:
                          identifier: main
          machine-learning:
            persistence:
              cache:
                type: persistentVolumeClaim
                size: 5Gi
                accessMode: ReadWriteOnce
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.4
      path: gitops/secrets/immich
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.4
      path: gitops/manifests/immich-postgres
    # Static hostPath-backed PV/PVC (immich-library), same name the chart
    # already references. Also closes a real gap found live: this PVC
    # previously existed only as an out-of-band, hand-created object —
    # never declared in GitOps, so a fresh cluster would have failed to
    # start Immich at all (existingClaim pointing at nothing).
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.4
      path: gitops/manifests/immich-library
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.4
      path: gitops/manifests/immich-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
