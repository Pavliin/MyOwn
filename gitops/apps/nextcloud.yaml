apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://nextcloud.github.io/helm
      chart: nextcloud
      targetRevision: 9.2.5
      helm:
        valuesObject:
          nextcloud:
            host: myown-nextcloud.local
            trustedDomains:
              - myown-nextcloud.local
            configs:
              # Nextcloud's SSRF guard (preventLocalAddress) blocks outbound
              # requests to hosts resolving to private/cluster IPs by default
              # — which is exactly what myown-authentik.local does from
              # inside the cluster. Without this, user_oidc's OIDC discovery
              # call fails with "violates local access rules" even though
              # the request itself succeeds (confirmed via curl from the pod).
              allow-local-remote-servers.config.php: |-
                <?php
                $CONFIG = array (
                  'allow_local_remote_servers' => true,
                );
            existingSecret:
              enabled: true
              secretName: nextcloud-secrets
              usernameKey: NEXTCLOUD_USERNAME
              passwordKey: NEXTCLOUD_PASSWORD
            extraEnv:
              - name: OIDC_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secrets
                    key: OIDC_CLIENT_ID
              - name: OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secrets
                    key: OIDC_CLIENT_SECRET
            hooks:
              # before-starting (not post-installation): the latter only fires
              # on a brand-new install (no config.php yet) — useless here since
              # Nextcloud was already installed before this SSO integration was
              # added. before-starting runs on every container start instead,
              # which is safe since both occ calls below are idempotent.
              before-starting: |
                #!/bin/sh
                set -e
                php occ app:install calendar || php occ app:enable calendar
                php occ app:install contacts || php occ app:enable contacts
                php occ app:install user_oidc || php occ app:enable user_oidc
                php occ user_oidc:provider authentik \
                  --clientid="$OIDC_CLIENT_ID" \
                  --clientsecret="$OIDC_CLIENT_SECRET" \
                  --discoveryuri="http://myown-authentik.local:8090/application/o/nextcloud/.well-known/openid-configuration"
          # user_oidc refuses to run OIDC login unless Nextcloud believes the
          # request came in over HTTPS. Traefik terminates TLS at the ingress
          # and forwards plain HTTP internally, so without this Nextcloud
          # still sees an HTTP request and rejects OIDC regardless of the
          # ingress TLS block below.
          phpClientHttpsFix:
            enabled: true
            protocol: https
          internalDatabase:
            enabled: false
          postgresql:
            enabled: true
            global:
              postgresql:
                auth:
                  username: nextcloud
                  database: nextcloud
                  existingSecret: nextcloud-secrets
            primary:
              persistence:
                enabled: true
                storageClass: local-path
                size: 4Gi
          # Used even with the bundled postgresql subchart above: this is what
          # Nextcloud's own container actually reads its DB credentials from
          # (see notes-techniques.md — the chart's auto-generated "-db" secret
          # bakes postgresql.global.postgresql.auth.password in as plaintext
          # at template time, bypassing existingSecret entirely).
          externalDatabase:
            existingSecret:
              enabled: true
              secretName: nextcloud-secrets
              usernameKey: DB_USERNAME
              passwordKey: password
          redis:
            enabled: true
            architecture: standalone
            auth:
              existingSecret: nextcloud-secrets
              existingSecretPasswordKey: REDIS_PASSWORD
            master:
              persistence:
                enabled: false
          persistence:
            enabled: true
            storageClass: local-path
            size: 5Gi
          ingress:
            enabled: true
            className: traefik
            tls:
              - secretName: nextcloud-tls
                hosts:
                  - myown-nextcloud.local
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: master
      path: gitops/secrets/nextcloud
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: master
      path: gitops/manifests/nextcloud-backup
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
