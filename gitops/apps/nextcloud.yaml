apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://nextcloud.github.io/helm
      chart: nextcloud
      targetRevision: 9.2.5
      helm:
        valuesObject:
          nextcloud:
            host: myown-nextcloud.local
            trustedDomains:
              - myown-nextcloud.local
              # Nextcloud rejects any Host header not in this list with a
              # plain 400, before even reaching the app — found live,
              # nextcloud.offsystem.fr returned 400 despite the Ingress
              # and cert both being correct. `host` above stays the LAN
              # name (what the chart uses to build its own internal
              # config), this list is what's actually checked per-request.
              - nextcloud.offsystem.fr
            configs:
              # Nextcloud's SSRF guard (preventLocalAddress) blocks outbound
              # requests to hosts resolving to private/cluster IPs by default
              # — which is exactly what myown-authentik.local does from
              # inside the cluster. Without this, user_oidc's OIDC discovery
              # call fails with "violates local access rules" even though
              # the request itself succeeds (confirmed via curl from the pod).
              allow-local-remote-servers.config.php: |-
                <?php
                $CONFIG = array (
                  'allow_local_remote_servers' => true,
                );
            existingSecret:
              enabled: true
              secretName: nextcloud-secrets
              usernameKey: NEXTCLOUD_USERNAME
              passwordKey: NEXTCLOUD_PASSWORD
            extraEnv:
              - name: OIDC_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secrets
                    key: OIDC_CLIENT_ID
              - name: OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-secrets
                    key: OIDC_CLIENT_SECRET
            hooks:
              # before-starting (not post-installation): the latter only fires
              # on a brand-new install (no config.php yet) — useless here since
              # Nextcloud was already installed before this SSO integration was
              # added. before-starting runs on every container start instead,
              # which is safe since both occ calls below are idempotent.
              #
              # Real gap found on a genuinely fresh install (mini PC bare-metal
              # bootstrap, 2026-08-20): before-starting fires *before* the base
              # image's own first-run install, so on container #1 ever, occ
              # isn't functional yet — the first `||` pair fails both branches,
              # `set -e` aborts the script, CrashLoopBackOff forever (Nextcloud
              # never gets a chance to complete its own install either). Guard
              # added below: skip entirely until Nextcloud reports installed,
              # so the base image's normal install path can run uninterrupted;
              # this hook picks up its job on the next container start.
              before-starting: |
                #!/bin/sh
                set -e
                php occ status --output=json 2>/dev/null | grep -q '"installed":true' || exit 0
                php occ app:install calendar || php occ app:enable calendar
                php occ app:install contacts || php occ app:enable contacts
                php occ app:install notes || php occ app:enable notes
                php occ app:install tasks || php occ app:enable tasks
                php occ app:install groupfolders || php occ app:enable groupfolders
                php occ app:install user_oidc || php occ app:enable user_oidc
                # Immich is now deployed and is the project's single photo
                # app (architecture.md §2, "one app per use case") — avoids
                # two uncoordinated photo libraries. app:disable is idempotent.
                php occ app:disable photos || true
                # authentik.offsystem.fr, not myown-authentik.local: Authentik
                # mirrors the Host of whichever request fetches discovery into
                # every URL in the returned document, including the one used
                # for the browser login redirect — so this exact hostname is
                # what an external user gets redirected to. Resolves
                # internally post split-horizon DNS either way (see
                # notes-techniques.md, "Nom de domaine réel + Let's Encrypt").
                php occ user_oidc:provider authentik \
                  --clientid="$OIDC_CLIENT_ID" \
                  --clientsecret="$OIDC_CLIENT_SECRET" \
                  --discoveryuri="https://authentik.offsystem.fr/application/o/nextcloud/.well-known/openid-configuration"
          # user_oidc refuses to run OIDC login unless Nextcloud believes the
          # request came in over HTTPS. Traefik terminates TLS at the ingress
          # and forwards plain HTTP internally, so without this Nextcloud
          # still sees an HTTP request and rejects OIDC regardless of the
          # ingress TLS block below.
          phpClientHttpsFix:
            enabled: true
            protocol: https
          internalDatabase:
            enabled: false
          postgresql:
            enabled: true
            global:
              postgresql:
                auth:
                  username: nextcloud
                  database: nextcloud
                  existingSecret: nextcloud-secrets
            primary:
              persistence:
                enabled: true
                storageClass: local-path
                size: 4Gi
          # Used even with the bundled postgresql subchart above: this is what
          # Nextcloud's own container actually reads its DB credentials from
          # (see notes-techniques.md — the chart's auto-generated "-db" secret
          # bakes postgresql.global.postgresql.auth.password in as plaintext
          # at template time, bypassing existingSecret entirely).
          externalDatabase:
            existingSecret:
              enabled: true
              secretName: nextcloud-secrets
              usernameKey: DB_USERNAME
              passwordKey: password
          redis:
            enabled: true
            architecture: standalone
            auth:
              existingSecret: nextcloud-secrets
              existingSecretPasswordKey: REDIS_PASSWORD
            master:
              persistence:
                enabled: false
          # hostPath fixe plutôt qu'un PVC à chemin auto-généré — pour que
          # les fichiers restent inspectables/modifiables directement sans
          # passer par kubectl, et survivent même cluster arrêté. Chemin
          # choisi sous /var/lib/rancher/k3s/storage/ (déjà un volume Docker
          # monté dans le conteneur k3d, donc persistant même si le
          # conteneur est recréé — pas un chemin arbitraire de sa couche
          # writable). Données migrées depuis l'ancien PVC avant bascule
          # (copie vérifiée identique par `diff -rq`), voir notes-techniques.md.
          persistence:
            enabled: true
            hostPath: /var/lib/rancher/k3s/storage/myown/nextcloud-data
          ingress:
            enabled: true
            className: traefik
            tls:
              - secretName: nextcloud-tls
                hosts:
                  - myown-nextcloud.local
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.10
      path: gitops/secrets/nextcloud
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.10
      path: gitops/manifests/nextcloud-backup
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: v0.1.10
      path: gitops/manifests/nextcloud-public
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
