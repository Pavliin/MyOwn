apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.2.0
      helm:
        valuesObject:
          # Chart 3.2.0's default image tag (resolved from its own
          # appVersion) pulls 10.11.8 — older than what the Authentik SSO
          # plugin below is actually compiled against (10.11.11, confirmed
          # via its .deps.json). Real bug hit live: plugin installed fine
          # but failed to load ("Failed to load assembly ... This error
          # occurs when a plugin references an incompatible version of one
          # of the shared libraries"), server logs confirmed. Pinned
          # explicitly rather than relying on the chart default, same
          # pattern as LiveKit's image.tag pin.
          image:
            tag: "10.11.11"
          # Real bug hit live: crash on startup with "System.IO.IOException:
          # The configured user limit (128) on the number of inotify
          # instances has been reached" (fs.inotify.max_user_instances on
          # the host, shared across every process on the machine, not
          # something to raise just for this one container). Fixed with the
          # chart's own documented workaround instead of touching the host
          # sysctl — makes Jellyfin poll for config file changes rather than
          # use inotify watchers.
          jellyfin:
            env:
              - name: DOTNET_USE_POLLING_FILE_WATCHER
                value: "1"
          persistence:
            config:
              storageClass: local-path
              size: 5Gi
            # Plus un PVC dédié : la famille dépose ses films/musiques dans
            # Nextcloud (déjà su comme geste, cf. photos/fichiers), Jellyfin
            # lit directement ce même dossier en lecture seule — une seule
            # source de vérité plutôt que deux copies à synchroniser à la
            # main. Chemin = le dossier de groupe Nextcloud "Mediatheque"
            # (app groupfolders, groupe "famille") — plusieurs comptes
            # personnels peuvent y déposer des fichiers avec leur propre
            # identité, pas un compte unique dédié. Chemin réel confirmé en
            # direct (id de dossier 1, cf. notes-techniques.md) plutôt que
            # calculé — l'id n'est pas garanti stable si le dossier est
            # recréé. readOnly: Jellyfin n'a jamais besoin d'écrire dans les
            # fichiers eux-mêmes, seulement dans /config et /cache (montés
            # à part).
            media:
              type: hostPath
              hostPath: /var/lib/rancher/k3s/storage/myown/nextcloud-data/data/__groupfolders/1
              readOnly: true
          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: myown-jellyfin.local
                paths:
                  - path: /
                    pathType: Prefix
          # Real bug hit live: the Android TV app's manual server-address
          # field only reaches Jellyfin by probing its native ports
          # (8096 http / 8920 https) directly against the hostname — it
          # never goes through Traefik's 443, and double-prefixes any
          # scheme typed into the field (confirmed: "https://https://..."),
          # so there's no client-side workaround. LoadBalancer, not
          # ClusterIP: same k3s ServiceLB mechanism already proven for
          # Traefik (80/443) and Mailu's externalService (imaps/smtps) —
          # binds 8096 on the node's real interface. LAN-only, deliberately:
          # nothing forwards 8096 from the Freebox to the internet, and
          # Pi-hole's local DNS override already resolves
          # jellyfin.offsystem.fr straight to the mini PC's LAN IP for LAN
          # clients, so the TV's own port probe succeeds on the very first
          # candidate (http/8096) without any app-side configuration.
          service:
            type: LoadBalancer
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: master
      path: gitops/secrets/jellyfin
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: master
      path: gitops/manifests/jellyfin-backup
    - repoURL: https://github.com/Pavliin/MyOwn.git
      targetRevision: master
      path: gitops/manifests/jellyfin-public
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
