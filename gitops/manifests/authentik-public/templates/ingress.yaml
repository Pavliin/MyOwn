# Authentik's only Ingress (single naming scheme, authentik.<domain>).
#
# Also the one Ingress that declares the wildcard certificate (<domain> +
# *.<domain>): Traefik caches it in acme.json and reuses it for every other
# router whose Host() falls under it, no further ACME request. It lives here
# because Authentik is always installed — it used to sit on Uptime Kuma's
# status page, optional, and LiveKit's TURN cert-sync (which reads this exact
# certificate) would then never get one on an install without Uptime Kuma
# (found 2026-10-29 preparing the B/C installer tests).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: {{ .Values.domain }}
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: "*.{{ .Values.domain }}"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - authentik.{{ .Values.domain }}
  rules:
    - host: authentik.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
