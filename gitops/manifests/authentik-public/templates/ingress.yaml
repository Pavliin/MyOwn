# Authentik's only Ingress (single naming scheme, authentik.<domain>).
#
# Wildcard certificate (<domain> + *.<domain>), declared identically on EVERY
# public Ingress (router.tls.domains annotations), so Traefik places a single
# ACME order and every router shares it. Found on the first fresh install
# (VM, 2026-10-29): with the wildcard declared on one Ingress only, the other
# routers each ordered their own certificate in parallel; the apex one (Matrix
# federation delegation, host = <domain>) used the same
# _acme-challenge.<domain> TXT name as the wildcard order, and its cleanup
# deleted the wildcard's challenge values — the wildcard order then waited
# forever. LiveKit's TURN cert-sync and Mailu read this exact certificate. The
# author's install never hit it: its wildcard predated the delegation Ingress.
# Before that, it was declared only on Uptime Kuma's status page, optional, so
# an install without Uptime Kuma never had one at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: {{ .Values.domain }}
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: "*.{{ .Values.domain }}"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - authentik.{{ .Values.domain }}
  rules:
    - host: authentik.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
