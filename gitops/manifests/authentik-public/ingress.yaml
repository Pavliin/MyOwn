# Authentik runs plain HTTP (myown-authentik.local:8090) today, no
# existing TLS Ingress to conflict with. Separate raw Ingress for
# consistency with the rest of this generalization pass. Reuses the
# wildcard cert already obtained via the Uptime Kuma canary.
#
# DNS+cert reachability only: makes the login page itself load externally,
# but every downstream service's SSO config (Vaultwarden `sso.authority`,
# Nextcloud's `--discoveryuri`, each Authentik blueprint's
# `redirect_uris`) still points at myown-<service>.local — a real SSO
# login started from a public hostname will not complete end-to-end until
# those are updated too. Deliberately out of scope here, same as the rest
# of this generalization pass (DNS+cert layer only, not full external
# functional validation per service).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - authentik.offsystem.fr
  rules:
    - host: authentik.offsystem.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
