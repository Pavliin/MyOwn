apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-jwt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lk-jwt-service
  template:
    metadata:
      labels:
        app: lk-jwt-service
    spec:
      containers:
        - name: lk-jwt-service
          image: ghcr.io/element-hq/lk-jwt-service:latest
          env:
            # The public-facing URL, not the in-cluster Service DNS name —
            # this is echoed back to the browser client as where to open
            # the actual WebSocket connection for media signaling, so it
            # must be something the browser itself can reach. wss:// (not
            # ws://) for the same mixed-content reason as the Ingress TLS
            # below. Real bug found via an actual Element Call join:
            # "ServerUnreachable" — curl/API tests never exercised this
            # value since they only cover the JWT-issuing side, not what
            # gets handed back to a real browser.
            # offsystem.fr, not myown-livekit.local: this is what actually
            # gets handed to the browser for the real media connection —
            # a remote family member's client needs a hostname it can
            # reach, matching the RTC media port-forward on the Freebox
            # (see notes-techniques.md, "Nom de domaine réel + Let's Encrypt").
            - name: LIVEKIT_URL
              value: wss://livekit.offsystem.fr
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: LIVEKIT_SECRET
            # Grants Tuwunel-authenticated users full access (can create
            # new LiveKit rooms and delegate delayed leave events, not
            # just join existing rooms) — matched against the Matrix
            # *server_name* of the requesting user (the part after ':' in
            # @robin:offsystem.fr), not the hosting domain
            # (tuwunel.offsystem.fr). Was still myown-tuwunel.local after
            # the 2026-08-23 server_name migration, silently downgrading
            # every real user to "restricted".
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: offsystem.fr
            # No CA override, no TLS-verify bypass: offsystem.fr and
            # tuwunel.offsystem.fr serve the Let's Encrypt wildcard, which
            # the image's own system bundle trusts. The dev-era
            # SSL_CERT_FILE (mkcert CA) would now *break* verification —
            # it replaces the system roots rather than adding to them
            # (rustls-native-certs, same as Go's behaviour before the
            # Rust rewrite). See notes-techniques.md, LiveKit section.
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
