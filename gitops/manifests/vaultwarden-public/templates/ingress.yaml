# Same reasoning as gitops/manifests/uptime-kuma-public/: the chart's own
# `ingress.tlsSecret` is a single static field, incompatible with a
# Traefik-managed ACME cert (needs `tls: {}` + a certResolver annotation,
# not a fixed Secret). Only Ingress for Vaultwarden (single naming
# scheme). Reuses the wildcard cert declared on the authentik-public
# Ingress, no new ACME request needed — just the certResolver annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vaultwarden.{{ .Values.domain }}
  rules:
    - host: vaultwarden.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
