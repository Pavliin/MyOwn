# Immich runs plain HTTP (myown-immich.local:8090) today, no existing TLS
# Ingress to conflict with — still a separate raw Ingress rather than
# adding tls to the chart's own values, for consistency with every other
# service in this generalization pass. Reuses the wildcard cert declared
# on the authentik-public Ingress, no new ACME request needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    # Same certificate on every public Ingress: one shared ACME order
    # (gitops/manifests/authentik-public, comment at the top).
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: {{ .Values.domain }}
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: "*.{{ .Values.domain }}"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - immich.{{ .Values.domain }}
  rules:
    - host: immich.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
