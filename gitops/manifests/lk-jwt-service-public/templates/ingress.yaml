# Separate Ingress rather than adding a second host to the existing
# gitops/manifests/lk-jwt-service/ingress.yaml (static secretName, same
# reasoning as tuwunel-public/livekit-public).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lk-jwt-service-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    # Same certificate on every public Ingress: one shared ACME order
    # (gitops/manifests/authentik-public, comment at the top).
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: {{ .Values.domain }}
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: "*.{{ .Values.domain }}"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - livekit-jwt.{{ .Values.domain }}
  rules:
    - host: livekit-jwt.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lk-jwt-service
                port:
                  number: 80
