apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuwunel
spec:
  replicas: 1
  strategy:
    # RocksDB locks its data directory exclusively — a second pod starting
    # before the first terminates (rolling update default) would fail to
    # open the database. Matches the single-writer assumption also used
    # for Vaultwarden (SQLite).
    type: Recreate
  selector:
    matchLabels:
      app: tuwunel
  template:
    metadata:
      labels:
        app: tuwunel
    spec:
      # Real bug found live (2026-08-23) testing federation with matrix.org
      # after the server_name migration: the regular pod network has no
      # IPv6 egress at all (confirmed via a debug pod: no default IPv6
      # route, direct IPv6 connect fails instantly) — same underlying gap
      # already hit and fixed for gandi-dyndns. Outbound federation
      # (make_join to a real dual-stack remote server) tried the AAAA
      # record DNS returned and never fell back to the working A record,
      # so every join attempt failed. hostNetwork gives the pod the host's
      # real dual-stack connectivity — same pattern as LiveKit.
      hostNetwork: true
      # Required alongside hostNetwork: true, or DNS resolution falls back
      # to the host's own /etc/resolv.conf instead of the in-cluster
      # resolver — would break Tuwunel's own internal lookups (e.g. its
      # OIDC calls to authentik.offsystem.fr via the split-horizon
      # CoreDNS override). Same gotcha already documented for LiveKit.
      dnsPolicy: ClusterFirstWithHostNet
      # Kubernetes auto-injects Docker-links-style env vars for every
      # Service in the namespace, named "<SVC>_..." uppercased — since the
      # Service here is itself named "tuwunel", that collides with the
      # app's own TUWUNEL_* config env var namespace (e.g. TUWUNEL_PORT,
      # TUWUNEL_SERVICE_HOST). tuwunel logs a warning for each unrecognized
      # one rather than erroring, but disable the mechanism entirely
      # instead of relying on explicit env vars always winning the
      # precedence race.
      enableServiceLinks: false
      containers:
        - name: tuwunel
          image: ghcr.io/matrix-construct/tuwunel:v1.8.3
          # Config lives entirely in a mounted file (gitops/secrets/tuwunel/)
          # rather than individual TUWUNEL_* env vars — the [[global.identity_provider]]
          # block needed for SSO can't be set via env vars at all (array-of-tables,
          # broken upstream: matrix-construct/tuwunel#340), and consolidating
          # everything into one file keeps a from-scratch install reproducible
          # from a single source instead of split across manifest + secret.
          env:
            - name: TUWUNEL_CONFIG
              value: /etc/tuwunel/tuwunel.toml
          ports:
            - containerPort: 8008
              name: client-server
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8008
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/tuwunel
            - name: config
              mountPath: /etc/tuwunel
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tuwunel-data
        - name: config
          secret:
            secretName: tuwunel-secrets
