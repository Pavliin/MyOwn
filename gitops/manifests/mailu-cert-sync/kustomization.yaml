apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` transformer here, deliberately — resources span
# kube-system (ServiceAccount, CronJob) and mailu (Role, RoleBinding),
# each already sets its own metadata.namespace.
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - cronjob.yaml
