# ForwardAuth middleware for Mailu's SSO (gitops/secrets/authentik-blueprints/
# mailu-sso.sops.yaml — a Proxy Provider, "Forward auth (single application)"
# mode, since Mailu has no native OIDC support). Validated end-to-end against
# a throwaway traefik/whoami target before ever pointing this at Mailu —
# see notes-techniques.md.
#
# Same namespace as the Ingress that will reference it (gitops/manifests/
# mailu-public/ingress.yaml) — Traefik doesn't allow cross-namespace
# Middleware references by default, confirmed live rather than assumed.
#
# NOT yet attached to that Ingress: proxyAuth activation is a deliberate
# later step (once Mailu's own webmail/admin login and a real internal
# mail flow are validated natively first) — see the plan's staged
# validation order.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mailu-forwardauth
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
