# Public side of Uptime Kuma: ONLY the status page. Until 2026-10-22 this
# Ingress routed "/" — the whole app, admin dashboard and login included,
# was reachable from the internet behind nothing but Uptime Kuma's own
# password. The paths below are exactly what the status page loads (read
# from its HTML and JS bundle; /serviceWorker.js found from a real phone visit); the admin UI moved to uptime.<domain>,
# restricted to the LAN/VPN (chart gitops/manifests/admin-access).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - status.{{ .Values.domain }}
  rules:
    - host: status.{{ .Values.domain }}
      http:
        paths:
          - path: /status/
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
          - path: /assets/
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
          - path: /api/status-page/
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
          - path: /api/entry-page
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
          - path: /upload/
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
          - path: /icon.svg
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
          - path: /favicon.ico
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
          - path: /serviceWorker.js
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
---
# status.<domain>/ → the status page itself (instead of a 404).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uptime-kuma-status-root
spec:
  redirectRegex:
    regex: ^https?://([^/]+)/?$
    replacement: https://${1}/status/{{ .Values.statusPageSlug }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma-status-root
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-uptime-kuma-status-root@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - status.{{ .Values.domain }}
  rules:
    - host: status.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
