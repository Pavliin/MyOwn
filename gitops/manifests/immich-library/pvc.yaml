apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Same name the chart already references via
  # immich.persistence.library.existingClaim in gitops/apps/immich.yaml —
  # keeps that reference unchanged, only how this PVC is bound changes.
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: immich-library-hostpath
  resources:
    requests:
      storage: 10Gi
