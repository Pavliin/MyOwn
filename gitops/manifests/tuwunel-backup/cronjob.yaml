apiVersion: batch/v1
kind: CronJob
metadata:
  name: tuwunel-restic-backup
spec:
  # After Vaultwarden (03:00), Nextcloud (03:15), Immich (03:30) — staggered
  # to avoid overlapping jobs on a single-node cluster.
  schedule: "45 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: restic-backup
              image: restic/restic:0.19.1
              env:
                - name: RESTIC_REPOSITORY
                  value: /repo
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tuwunel-secrets
                      key: RESTIC_PASSWORD
              command:
                - sh
                - -c
                - |
                  set -eu
                  restic snapshots >/dev/null 2>&1 || restic init
                  restic backup /data --tag tuwunel
                  restic forget --tag tuwunel --keep-daily 7 --keep-weekly 4 --keep-monthly 3 --prune
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: repo
                  mountPath: /repo
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tuwunel-data
            - name: repo
              persistentVolumeClaim:
                claimName: tuwunel-restic-repo
