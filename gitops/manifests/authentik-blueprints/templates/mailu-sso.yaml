{{- if has "mailu" .Values.apps }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-mailu-sso
data:
  mailu-sso.yaml: |
    version: 1
    metadata:
      name: mailu-sso
    entries:
      # Mailu has no native OIDC support (confirmed in its docs) — only a
      # reverse-proxy forward-auth scheme trusting a header (PROXY_AUTH_HEADER,
      # default X-Auth-Email). This is Authentik's Proxy Provider in
      # "Forward auth (single application)" mode, the first ForwardAuth setup
      # in this repo (every other service uses a real OAuth2/OIDC Provider) —
      # gitops/manifests/mailu-forwardauth/middleware.yaml is the matching
      # Traefik Middleware, attached to the Mailu Ingress via annotation.
      #
      # ProxyProvider inherits from OAuth2Provider under the hood, but created
      # through the ORM/blueprints (not Authentik's own admin API) it does
      # NOT get `redirect_uris`/`grant_types`/`property_mappings` auto-filled
      # the way the admin UI would (that logic lives in
      # ProxyProvider.set_oauth_defaults(), only called from the API
      # serializer) — confirmed live: a provider created without these
      # explicit values fails login with "Redirect URI Error". Values below
      # are copied from what set_oauth_defaults() itself computes, verified
      # via `ak shell` against a throwaway `traefik/whoami` target before
      # ever pointing this at Mailu for real.
      - model: authentik_providers_proxy.proxyprovider
        id: mailu-provider
        identifiers:
          name: mailu
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://mailu.{{ .Values.domain }}
          internal_host: ""
          client_type: confidential
          # user_uuid, not the default hashed_user_id: stable across
          # username changes, same choice already made for every other
          # OAuth2-based provider in this project (Vaultwarden, Nextcloud, ...).
          sub_mode: user_uuid
          grant_types:
            - authorization_code
            - client_credentials
            - password
          redirect_uris:
            - matching_mode: strict
              url: "https://mailu.{{ .Values.domain }}/outpost.goauthentik.io/callback?X-authentik-auth-callback=true"
            - matching_mode: strict
              url: "https://mailu.{{ .Values.domain }}?X-authentik-auth-callback=true"
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-entitlements"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/proxy/scope-proxy"]]
      - model: authentik_core.application
        identifiers:
          slug: mailu
        attrs:
          name: Mailu
          provider: !KeyOf mailu-provider
          policy_engine_mode: any
      # NOT bound to the embedded outpost's `providers` list here on purpose:
      # that's a plain M2M field, and a blueprint `attrs.providers` on the
      # Outpost model replaces the whole list on every sync rather than
      # appending — would silently unbind any other ForwardAuth provider
      # added later (e.g. a future ArgoCD/Grafana protection). Binding is
      # additive (`.add()`) via scripts/authentik-outpost-config.sh
      # --bind-provider mailu instead, run once after this blueprint applies
      # (same script also sets authentik_host/authentik_host_browser, needed
      # for this provider's browser-facing login redirect to resolve to
      # https://authentik.{{ .Values.domain }} instead of the http://localhost
      # default — a real bug found live before this blueprint was written).
{{- end }}
