{{- if has "immich" .Values.apps }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-immich-sso
data:
  immich-sso.yaml: |
    version: 1
    metadata:
      name: Immich SSO
    entries:
      {{- include "myown.emailVerifiedMapping" . | nindent 6 }}
      - model: authentik_providers_oauth2.oauth2provider
        id: immich-provider
        identifiers:
          name: immich
        attrs:
          client_type: confidential
          client_id: immich
          client_secret: !Env IMMICH_CLIENT_SECRET
          sub_mode: user_uuid
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !KeyOf email-verified-mapping
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          redirect_uris:
            - matching_mode: strict
              url: 'app.immich:///oauth-callback'
              redirect_uri_type: authorization
            - matching_mode: strict
              url: 'https://immich.{{ .Values.domain }}/auth/login'
              redirect_uri_type: authorization
            - matching_mode: strict
              url: 'https://immich.{{ .Values.domain }}/user-settings'
              redirect_uri_type: authorization
      - model: authentik_core.application
        identifiers:
          slug: immich
        attrs:
          name: Immich
          provider: !KeyOf immich-provider
          open_in_new_tab: false
{{- end }}
