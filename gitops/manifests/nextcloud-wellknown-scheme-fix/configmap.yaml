# Real bug found live (2026-08-24), while wiring up Mailu's webmail CardDAV
# integration: https://nextcloud.offsystem.fr/.well-known/carddav (and the
# same rule for /caldav) redirects to http://, not https://. Root cause:
# the redirect target in Nextcloud's own shipped .htaccess
# (`RewriteRule ^\.well-known/carddav /remote.php/dav/ [R=301,L]`) is a
# root-relative path with no scheme, so Apache's mod_rewrite builds the
# absolute redirect URL itself via ap_http_scheme() — which resolves to
# "http" because this vhost genuinely listens on plain :80 (TLS terminates
# upstream at Traefik), independent of Nextcloud's own PHP-level
# `overwriteprotocol => 'https'` config.php setting (that only affects
# URLs generated by PHP, not this Apache-level rewrite).
#
# Two fix attempts tried live and abandoned, in order:
#   1. `SetEnvIf X-Forwarded-Proto https HTTPS=on` — has no effect on
#      mod_rewrite's own absolute-URL scheme construction (that's a
#      PHP/CGI convention, unrelated to Apache's internal scheme
#      resolution for redirects).
#   2. `Header always edit Location "^http://" "https://"` (mod_headers) —
#      confirmed mod_headers itself was loading correctly (a `Header set`
#      test directive showed up in the response), but the Location edit
#      never took effect for reasons not fully understood.
#
# Real fix: a RewriteRule with an explicit absolute https:// target,
# placed directly inside the <VirtualHost> block. Confirmed live (via an
# unambiguous https://example.com/TEST-MARKER redirect target) that a rule
# placed in a *separate* /etc/apache2/conf-enabled/*.conf file — the
# obvious first attempt — is silently never consulted for requests
# handled by this named VirtualHost: mod_rewrite rules declared in the
# main/global server context are NOT inherited by a VirtualHost unless
# that VirtualHost explicitly opts in with `RewriteOptions Inherit`
# (a well-documented but easy-to-forget mod_rewrite quirk). Placing the
# rule inside the VirtualHost block itself, with `[L]` to stop further
# rule processing (so Nextcloud's own later .htaccess rule for the same
# path never gets a chance to fire), works correctly and was verified for
# both /.well-known/carddav and /.well-known/caldav.
#
# This is a full copy of the base php-apache image's own
# /etc/apache2/sites-enabled/000-default.conf with that one addition,
# mounted over the original via extraVolumes/extraVolumeMounts in
# gitops/apps/nextcloud.yaml (this file is static, not templated at
# container start, unlike e.g. Mailu's snuffleupagus.rules.tpl — so a
# plain ConfigMap mount is sufficient, no Jinja2/entrypoint hook needed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-wellknown-scheme-fix
  namespace: nextcloud
data:
  000-default.conf: |
    <VirtualHost *:80>
    	# The ServerName directive sets the request scheme, hostname and port that
    	# the server uses to identify itself. This is used when creating
    	# redirection URLs. In the context of virtual hosts, the ServerName
    	# specifies what hostname must appear in the request's Host: header to
    	# match this virtual host. For the default virtual host (this file) this
    	# value is not decisive as it is used as a last resort host regardless.
    	# However, you must set it for any further virtual host explicitly.
    	#ServerName www.example.com

    	ServerAdmin webmaster@localhost
    	DocumentRoot /var/www/html

    	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
    	# error, crit, alert, emerg.
    	# It is also possible to configure the loglevel for particular
    	# modules, e.g.
    	#LogLevel info ssl:warn

    	ErrorLog ${APACHE_LOG_DIR}/error.log
    	CustomLog ${APACHE_LOG_DIR}/access.log combined

    	# For most configuration files from conf-available/, which are
    	# enabled or disabled at a global level, it is possible to
    	# include a line for only one particular virtual host. For example the
    	# following line enables the CGI configuration for this host only
    	# after it has been globally disabled with "a2disconf".
    	#Include conf-available/serve-cgi-bin.conf

    	# Fixes the .well-known/(card|cal)dav http:// redirect bug described
    	# above — must stay inside this <VirtualHost> block, see the comment
    	# at the top of this ConfigMap for why a separate conf-enabled file
    	# doesn't work.
    	RewriteEngine On
    	RewriteRule ^/.well-known/(card|cal)dav$ https://nextcloud.offsystem.fr/remote.php/dav/ [R=301,L]
    </VirtualHost>
