# Only Ingress for Tuwunel (single naming scheme; the old mkcert
# myown-tuwunel.local Ingress is gone). Reuses the wildcard cert declared
# on the authentik-public Ingress.
#
# Client-server API only (port 8008, same as the existing Ingress) — real
# Matrix federation (8448) and the well-known server_name wiring needed
# for it stay deferred to Phase 4 as already planned in roadmap.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tuwunel-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    # Same certificate on every public Ingress: one shared ACME order
    # (gitops/manifests/authentik-public, comment at the top).
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: {{ .Values.domain }}
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: "*.{{ .Values.domain }}"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tuwunel.{{ .Values.domain }}
  rules:
    - host: tuwunel.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tuwunel
                port:
                  number: 8008
