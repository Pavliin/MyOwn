# Separate Ingress rather than adding a second host to the existing
# gitops/manifests/tuwunel/ingress.yaml: that Ingress's single `tls` entry
# uses a static `secretName` (mkcert) for myown-tuwunel.local — mixing a
# static-secret host and a certResolver host under one Ingress object's
# annotations (which apply Ingress-wide, not per-host) risked the
# certResolver being applied to the .local host too. A separate object
# keeps the two completely independent. Reuses the wildcard cert already
# obtained via the Uptime Kuma canary.
#
# Client-server API only (port 8008, same as the existing Ingress) — real
# Matrix federation (8448) and the well-known server_name wiring needed
# for it stay deferred to Phase 4 as already planned in roadmap.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tuwunel-public
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tuwunel.offsystem.fr
  rules:
    - host: tuwunel.offsystem.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tuwunel
                port:
                  number: 8008
