# Split-horizon DNS for pods: every <service>.<domain> served by the cluster
# resolves, from inside the cluster, to Traefik's internal Service instead of
# the public address — server-to-server calls (OIDC discovery and token
# exchange with Authentik, Uptime Kuma probes, Matrix well-known lookups)
# never round-trip through the box, and get the same certificate a family
# member's browser does. Required, not cosmetic: Authentik builds the URLs of
# its discovery document from the Host of the request that fetched it, so the
# public name must work from inside the cluster too.
#
# Template: __DOMAIN__ is replaced by the install domain when applied
# (scripts/install.sh; by hand: sed 's/__DOMAIN__/<domain>/g' <this file> |
# kubectl apply -f -). Same list of names as Pi-hole's local records for LAN
# clients (scripts/pihole-setup.sh). Mechanism: k3s's own Corefile imports
# /etc/coredns/custom/*.override; rewrite rather than a `hosts` block (the
# default Corefile already uses its single `hosts` slot). Not GitOps-managed,
# same as ArgoCD's own install. Single naming scheme since 2026-10-27: the
# former myown-*.local rules are gone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  myown.override: |
    rewrite name exact authentik.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact vaultwarden.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact nextcloud.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact immich.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact tuwunel.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact jellyfin.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact livekit.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact livekit-jwt.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact mailu.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact status.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact uptime.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact argocd.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact grafana.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
    rewrite name exact ollama.__DOMAIN__ traefik-internal.kube-system.svc.cluster.local
