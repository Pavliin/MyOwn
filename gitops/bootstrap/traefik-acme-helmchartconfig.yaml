# Overlays k3s's own built-in Traefik HelmChart (kube-system/traefik,
# managed by k3s's Addon controller — never edit that HelmChart directly,
# it gets reset on every k3s restart). HelmChartConfig is the mechanism
# k3s provides specifically to extend a built-in addon chart's values
# without touching the HelmChart resource itself; same name/namespace as
# the HelmChart it overlays.
#
# Adds a DNS-01 ACME resolver so Traefik can obtain a real Let's Encrypt
# wildcard certificate (*.<domain> + apex). DNS-01 doesn't require port 80
# inbound — only outbound access to the DNS provider's API and Let's
# Encrypt's ACME servers. Any provider supported by lego (the ACME library
# Traefik bundles, 100+ providers, no extra webhook/controller needed).
#
# Template, like coredns-custom.yaml: scripts/install.sh replaces
# __DNS_PROVIDER__ (lego provider code) and __ACME_EMAIL__ before applying
# it (manuel-installation.md §16). The provider's credentials come from the
# Secret `dns-provider-credentials` in kube-system, loaded whole as
# environment variables: its keys are the variable names lego documents for
# that provider. Created by the installer, never committed.
#
# Applied outside ArgoCD's app-of-apps, like the other gitops/bootstrap/
# files ("ArgoCD manages everything except the bootstrap layer itself").
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Keep the real client address. With the default
    # externalTrafficPolicy: Cluster, kube-proxy source-NATs every incoming
    # connection: Traefik, its access logs and Authentik (brute-force
    # protection, X-Forwarded-For) all saw every visitor — internet included
    # — as a 10.42.x.x cluster address (7 days of logs, 2026-10-22). That
    # also made any IP allow-list meaningless, or worse, since internet
    # traffic looked internal. Local skips the SNAT; single node, Traefik's
    # pod is always on it, so no traffic is dropped.
    service:
      spec:
        externalTrafficPolicy: Local
    persistence:
      enabled: true
      path: /data
    envFrom:
      - secretRef:
          name: dns-provider-credentials
    deployment:
      initContainers:
        # acme.json must be 0600 or lego refuses to use it — the PVC
        # starts out root-owned, this runs once before Traefik itself.
        - name: acme-permissions
          image: busybox:1.36
          command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
          volumeMounts:
            - name: data
              mountPath: /data
    certificatesResolvers:
      letsencrypt:
        acme:
          email: __ACME_EMAIL__
          storage: /data/acme.json
          # Validated on the staging CA first (2026-08-22): real
          # "(STAGING) Let's Encrypt" cert obtained and served for
          # offsystem.fr/*.offsystem.fr, confirmed via openssl s_client —
          # proved the DNS-01 pipeline end-to-end before touching
          # production rate limits. No caServer override here now:
          # Traefik's own default is the real production ACME directory.
          dnsChallenge:
            provider: __DNS_PROVIDER__
    # Real gap found deploying Mailu on the mini PC (2026-08-24): the dev
    # cluster's mailu-outpost-callback IngressRoute (gitops/manifests/
    # mailu-forwardauth/) routes cross-namespace (mailu -> authentik) and
    # had always worked there with no explicit flag set anywhere in this
    # repo — turns out to depend on an undocumented default that isn't
    # actually identical between the two clusters' bundled Traefik
    # versions (dev: 3.6.13, mini PC: 3.7.8, confirmed via
    # `kubectl get helmchart traefik -o jsonpath='{.spec.image.tag}'` on
    # each). The mini PC's Traefik rejected the route outright ("service
    # authentik/authentik-server not in the parent resource namespace
    # mailu"). Setting this explicitly removes the dependency on whatever
    # each version's default happens to be.
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    # Added 2026-08-22 specifically to diagnose the MISSING_MATRIX_RTC_TRANSPORT
    # LiveKit investigation (notes-techniques.md) — no request-level visibility
    # existed before this, only Traefik's own internal/error logs. Cheap to
    # keep enabled permanently (JSON access logs, no behavior change).
    logs:
      access:
        enabled: true
        format: json
    # Real gap found migrating a personal video library via rclone/WebDAV
    # (2026-08-24): Traefik's own default readTimeout on this entrypoint
    # (60s) caps the total time allowed to read an incoming request body —
    # confirmed via the access log above (OriginDuration/Duration both
    # landing at exactly ~60.000s on the failing PUTs, "502 Bad Gateway").
    # Any upload/download taking longer than 60s at the client's actual
    # throughput fails regardless of retries — not Nextcloud-specific, this
    # is the shared entrypoint every HTTPS service goes through. 0 disables
    # the timeout entirely, matching Apache's own APACHE_BODY_LIMIT=0 fix
    # applied the same day for the same underlying migration.
    ports:
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0s
