# Strategic merge patch enabling KSOPS on argocd-repo-server (SOPS-encrypted
# secrets decrypted automatically at sync time via a kustomize exec plugin).
# Not applied by ArgoCD itself — this is part of the one-time cluster
# bootstrap, same status as installing ArgoCD itself. Apply with:
#   kubectl patch deployment argocd-repo-server -n argocd --type strategic \
#     --patch-file gitops/bootstrap/argocd-repo-server-ksops-patch.yaml
# Requires the sops-age Secret (private key) to already exist in argocd
# namespace — see CLAUDE.md for how to (re)create it.
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
      containers:
        - name: argocd-repo-server
          volumeMounts:
            - mountPath: /usr/local/bin/kustomize
              name: custom-tools
              subPath: kustomize
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops
            - mountPath: /.config/sops/age
              name: sops-age
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
