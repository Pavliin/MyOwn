name: Build Phase 5 image

on:
  push:
    branches: [master]
    paths:
      - "phase5/**"
      - ".github/workflows/phase5-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: phase5
          push: true
          # ghcr.io/pavliin, lowercase, not ${{ github.repository_owner }}
          # (Pavliin) — GHCR image names must be lowercase, the mixed-case
          # form fails the push outright.
          tags: |
            ghcr.io/pavliin/myown-phase5:latest
            ghcr.io/pavliin/myown-phase5:${{ github.sha }}
